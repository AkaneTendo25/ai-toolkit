---
job: extension
config:
  name: "my_acestep_lora_vanilla_v1"
  process:
    - type: "acestep_lora_trainer"
      acestep_repo_path: "G:/samples/ACE-Step-1.5"
      use_uv: true
      subcommand: "vanilla"
      checkpoint_dir: "G:/samples/ACE-Step-1.5/checkpoints"
      model_variant: "turbo"
      dataset_dir: "G:/datasets/acestep/preprocessed_tensors/my_dataset"
      output_dir: "output/[name]"

      adapter_type: "lora"
      rank: 64
      alpha: 128
      dropout: 0.1
      target_modules:
        - "q_proj"
        - "k_proj"
        - "v_proj"
        - "o_proj"

      learning_rate: 1.0e-4
      batch_size: 1
      gradient_accumulation: 4
      epochs: 100
      save_every: 10
      warmup_steps: 100
      num_workers: 0
      device: "auto"
      precision: "auto"
      yes: true
